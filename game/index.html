<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SETTINGS -->
<div id="settings">
  <button onclick="togglePlay()">⏯</button>
  <button onclick="restartGame()">⟳</button>
  <input type="range" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)">
</div>

<button id="backBtn" onclick="goBack()">⟵ Back</button>

<button id="helpBtn">?</button>

<div id="helpBox" class="hide">
  <h3>🎮 How to Play</h3>
  <p>Press <b>S D J K</b> when notes reach the line.</p>
</div>

<div id="layout">

<!-- LEFT -->
<div id="songs">
  <h2>Songs</h2>
  <ul id="songList"></ul>
</div>

<!-- GAME -->
<div id="game">
<select id="songDropdown"></select>

<div id="score">Score: 0</div>
<div id="combo" class="hide">0x</div>
<div id="feedback"></div>
<div id="highScore">Best: 0</div>

<div id="startScreen">
  <input id="playerName" placeholder="Username">
  <button id="startBtn">Start Game</button>
</div>

<div id="lanes">
  <div class="lane" data-key="s"><span>S</span></div>
  <div class="lane" data-key="d"><span>D</span></div>
  <div class="lane" data-key="j"><span>J</span></div>
  <div class="lane" data-key="k"><span>K</span></div>
</div>

<div id="hitLine"></div>
</div>

<!-- RIGHT -->
<div id="leaderboard">
  <h2>Leaderboard</h2>
  <ul id="leaderList"></ul>
</div>

</div>

<audio id="audio" loop></audio>
<script src="script.js"></script>

</body>
</html>
