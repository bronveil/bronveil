<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div id="topBar">
  <button id="songBtn">🎵</button>
  <div id="centerControls">
    <button onclick="togglePlay()">⏯</button>
    <button onclick="restartGame()">⟳</button>
  </div>
  <button id="leaderBtn">🏆</button>
</div>

<!-- SIDE PANELS -->
<div id="songPanel" class="panel">
  <h2>Songs</h2>
  <ul id="songList"></ul>
</div>

<div id="leaderPanel" class="panel right">
  <h2>Leaderboard</h2>
  <ul id="leaderList"></ul>
</div>

<!-- GAME -->
<div id="game">

<div id="score">Score: 0</div>
<div id="highScore">Best: 0</div>
<div id="combo" class="hide">0x</div>
<div id="feedback"></div>

<div id="startScreen">
  <input id="playerName" placeholder="Username">
  <button id="startBtn">Start Game</button>
</div>

<div id="lanes">
  <div class="lane" data-key="s"><span>S</span></div>
  <div class="lane" data-key="d"><span>D</span></div>
  <div class="lane" data-key="j"><span>J</span></div>
  <div class="lane" data-key="k"><span>K</span></div>
</div>

<div id="hitLine"></div>

</div>

<audio id="audio" loop></audio>

<script src="script.js"></script>
</body>
</html>
